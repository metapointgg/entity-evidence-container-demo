[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-evidence-container-demo"
version = "0.1.0"
description = "FITS-based entity evidence container proof of concept"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.0.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
