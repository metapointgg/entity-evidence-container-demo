[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entity-evidence-container-demo"
version = "0.2.0"
description = "FITS-based entity evidence container proof of concept"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.0.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.35.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "scikit-learn>=1.4.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
test = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
